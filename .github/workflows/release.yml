name: Release Automation

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            xvfb libgtk-3-0 gir1.2-gtk-3.0 libcairo2 python3-gi python3-gi-cairo python3-cairo \
            python3-websockets python3-xlib python3-pytest python3-pytest-asyncio \
            python3-qrcode python3-pil python3-build dpkg-dev adb

      - name: Run unified monorepo build
        run: |
          chmod +x scripts/build-all.sh
          ./scripts/build-all.sh

      - name: Publish GitHub Release Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.ref_name }} \
            dist/clink-android-debug.apk \
            dist/clink-android-release.apk \
            dist/clink-android-release.aab \
            dist/clink_1.0.0_all.deb \
            dist/clink-1.0.0-py3-none-any.whl \
            dist/clink-1.0.0.tar.gz \
            dist/clink-linux-1.0.0-x86_64.tar.gz \
            dist/SHA256SUMS.txt \
            --clobber || \
          gh release create ${{ github.ref_name }} \
            dist/clink-android-debug.apk \
            dist/clink-android-release.apk \
            dist/clink-android-release.aab \
            dist/clink_1.0.0_all.deb \
            dist/clink-1.0.0-py3-none-any.whl \
            dist/clink-1.0.0.tar.gz \
            dist/clink-linux-1.0.0-x86_64.tar.gz \
            dist/SHA256SUMS.txt \
            --title "Clink ${{ github.ref_name }}" \
            --notes "Production Release of Clink: Android-powered drawing tablet and real-time desktop annotation system for Linux."
