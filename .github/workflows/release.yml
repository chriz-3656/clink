name: Release Automation

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Linux build dependencies & Windows cross-compilers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            xvfb libgtk-3-0 gir1.2-gtk-3.0 libcairo2 python3-gi python3-gi-cairo python3-cairo \
            python3-websockets python3-xlib python3-pytest python3-pytest-asyncio \
            python3-qrcode python3-pil dpkg-dev adb libxkbcommon-x11-0 mingw-w64 nsis
          rustup target add x86_64-pc-windows-gnu

      - name: Run unified monorepo build
        run: |
          chmod +x scripts/build-all.sh
          ./scripts/build-all.sh

      - name: Publish GitHub Release Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release upload "${GITHUB_REF_NAME}" \
            dist/clink-gui-linux-x86_64 \
            dist/clink-native-linux-x86_64 \
            "dist/clink_${VERSION}_amd64.deb" \
            dist/clink-windows-x86_64.exe \
            "dist/clink-setup-v${VERSION}-windows-x86_64.exe" \
            dist/clink-android-debug.apk \
            dist/clink-android-release.apk \
            dist/SHA256SUMS.txt \
            --clobber || \
          gh release create "${GITHUB_REF_NAME}" \
            dist/clink-gui-linux-x86_64 \
            dist/clink-native-linux-x86_64 \
            "dist/clink_${VERSION}_amd64.deb" \
            dist/clink-windows-x86_64.exe \
            "dist/clink-setup-v${VERSION}-windows-x86_64.exe" \
            dist/clink-android-debug.apk \
            dist/clink-android-release.apk \
            dist/SHA256SUMS.txt \
            --title "Clink ${GITHUB_REF_NAME}" \
            --notes "Production Release of Clink: Android-powered drawing tablet and real-time desktop annotation system for Linux and Windows."
