name: Linux Tests & Packaging

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            xvfb libgtk-3-dev libcairo2-dev python3-gi adb

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip build
          pip install websockets pycairo PyGObject python-xlib pytest pytest-asyncio

      - name: Run automated test suite
        run: |
          PYTHONPATH=linux/src:linux/tests pytest -v linux/tests

      - name: Build distribution packages
        run: |
          python -m build linux
