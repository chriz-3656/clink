name: Linux Tests & Packaging

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            xvfb libgtk-3-0 gir1.2-gtk-3.0 libcairo2 python3-gi python3-gi-cairo python3-cairo \
            python3-websockets python3-xlib python3-pytest python3-pytest-asyncio \
            python3-qrcode python3-pil python3-build adb

      - name: Run Rust automated test suite
        run: |
          cargo test --all

      - name: Run automated test suite
        run: |
          PYTHONPATH=linux/src:linux/tests python3 -m pytest -v linux/tests

      - name: Build distribution packages
        run: |
          python3 -m build linux
